services:
  backend:
    build: ./backend
    environment:
      DAY_AHEAD_CUTOFF_HOUR_UTC: ${DAY_AHEAD_CUTOFF_HOUR_UTC:-12}
      ELEXON_TIMEOUT_SECONDS: ${ELEXON_TIMEOUT_SECONDS:-30}
      ELEXON_CACHE_TTL_SECONDS: ${ELEXON_CACHE_TTL_SECONDS:-21600}
    ports:
      - "8000:8000"
    volumes:
      - elexon_cache:/app/.cache
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  elexon_cache:
